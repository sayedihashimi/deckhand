name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Windows runners check out with CRLF by default, which makes gofmt flag every file.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (e2e tag)
        run: go vet -tags e2e ./...

      - name: Build
        run: go build -o deckhand.exe .

      - name: Unit tests
        run: go test ./...

      # Drives deckhand in a real ConPTY; about 4 minutes here.
      - name: E2E tests
        run: go test -tags e2e -v -timeout 20m
